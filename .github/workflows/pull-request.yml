name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK components
        run: >-
          sdkmanager
          'platforms;android-36'
          'build-tools;35.0.0'
          'ndk;26.1.10909125'
          'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4

      - name: Create inert local build inputs
        run: |
          printf '%s\n' \
            'APP_LAYOUT=' \
            'TMDB_API_KEY=fixture-only' \
            'SUBDL_API_KEY=fixture-only' \
            'RABBITSTREAM_SOURCE_API=https://invalid.local/' > local.properties
          sed -e 's|{{UPROT_MSFI_API_BASE}}|https://invalid.local/msfi|g' \
              -e 's|{{UPROT_MSE_API_BASE}}|https://invalid.local/mse|g' \
              -e 's|{{UPROT_API_KEY}}|fixture-only|g' \
              app/src/main/cpp/native-lib.cpp.template > app/src/main/cpp/native-lib.cpp
          chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint generic layout
        run: ./gradlew :app:lintDebug

      - name: Build generic debug layout
        run: ./gradlew :app:assembleDebug

      - name: Build mobile debug layout
        run: |
          sed -i 's/^APP_LAYOUT=.*/APP_LAYOUT=mobile/' local.properties
          ./gradlew --no-configuration-cache :app:assembleDebug

      - name: Build TV debug layout
        run: |
          sed -i 's/^APP_LAYOUT=.*/APP_LAYOUT=tv/' local.properties
          ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest
