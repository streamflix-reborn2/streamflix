name: Build APK (debug)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties (CI defaults, no secrets)
        run: |
          {
            echo "APP_LAYOUT="
            echo "TMDB_API_KEY=DUMMY"
            echo "SUBDL_API_KEY=DUMMY"
            echo "RABBITSTREAM_SOURCE_API=DUMMY"
          } > local.properties
          cat local.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
